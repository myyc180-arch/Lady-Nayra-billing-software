name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Electron and Electron Builder
        run: npm install --save-dev electron@22.3.27 electron-builder@24.13.3

      - name: Prepare web folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path www | Out-Null

          if (Test-Path index.html) {
            Copy-Item index.html www/index.html -Force
          }

          if (Test-Path manifest.json) {
            Copy-Item manifest.json www/manifest.json -Force
          }

          if (Test-Path sw.js) {
            Copy-Item sw.js www/sw.js -Force
          }

          if (Test-Path icon.png) {
            Copy-Item icon.png www/icon.png -Force
          }

      - name: Create Electron main.js
        shell: pwsh
        run: |
          @"
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              minWidth: 900,
              minHeight: 600,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false
              }
            });

            win.loadFile(path.join(__dirname, 'www', 'index.html'));
          }

          app.whenReady().then(() => {
            createWindow();

            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) {
                createWindow();
              }
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });
          "@ | Set-Content main.js

      - name: Create Electron package.json
        shell: pwsh
        run: |
          @"
          {
            "name": "lady-nayra-billing",
            "version": "1.0.0",
            "description": "LADY NAYRA Billing Software",
            "main": "main.js",
            "author": "LADY NAYRA",
            "license": "MIT",
            "scripts": {
              "start": "electron .",
              "dist": "electron-builder --win --x64 --publish never"
            },
            "devDependencies": {
              "electron": "22.3.27",
              "electron-builder": "24.13.3"
            },
            "build": {
              "appId": "com.ladynayra.billing",
              "productName": "LADY NAYRA Billing",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.js",
                "www/**/*",
                "package.json"
              ],
              "win": {
                "target": [
                  {
                    "target": "nsis",
                    "arch": [
                      "x64"
                    ]
                  }
                ]
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true
              }
            }
          }
          "@ | Set-Content electron-package.json

      - name: Use Electron package configuration
        shell: pwsh
        run: Copy-Item electron-package.json package.json -Force

      - name: Build Windows EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: LADY-NAYRA-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
