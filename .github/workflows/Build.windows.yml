name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli

      - name: Install Electron
        run: npm install --save-dev electron electron-builder

      - name: Prepare web folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path www | Out-Null
          Copy-Item index.html www/index.html -Force
          if (Test-Path manifest.json) {
            Copy-Item manifest.json www/manifest.json -Force
          }
          if (Test-Path sw.js) {
            Copy-Item sw.js www/sw.js -Force
          }
          if (Test-Path icon.png) {
            Copy-Item icon.png www/icon.png -Force
          }

      - name: Build Windows EXE
        run: npx electron-builder --win --x64

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: LADY-NAYRA-Windows
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: warn
